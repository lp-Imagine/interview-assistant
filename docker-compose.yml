version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-interview-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_interview}
    ports:
      # 只绑本机 + 端口错开（避免与 Draftly 等项目的 5432 冲突、防暴露公网）
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6380}:6379"

volumes:
  pgdata:
